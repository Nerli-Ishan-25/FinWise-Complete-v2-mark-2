name: Maintenance Automation

on:
  schedule:
    # Runs automatically once every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

jobs:
  run-maintenance:
    name: Run Maintenance Script
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install GitPython

      - name: Configure Git User
        run: |
          git config user.name "Maintenance Automation Bot"
          git config user.email "maintenance-bot@users.noreply.github.com"

      - name: Execute Maintenance Script
        run: |
          python Backend/maintenance_script.py
